<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Base with Spine & Border -->
  <rect width="600" height="800" rx="16" fill="url(#bgG)"/>

  <!-- Realistic Book Spine 3D Shadow on Left -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="#000000" fill-opacity="0.25"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Outer Frame -->
  <rect x="55" y="45" width="490" height="710" rx="8" fill="none" stroke="#8DA9C4" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="65" y="55" width="470" height="690" rx="4" fill="none" stroke="#8DA9C4" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Category Tag -->
  <rect x="75" y="80" width="140" height="30" rx="6" fill="#8DA9C4" fill-opacity="0.2"/>
  <text x="145" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#8DA9C4" letter-spacing="2">
    FIKSI POPULER
  </text>

  <!-- Central Graphic Illustration -->
  <g transform="translate(300, 340)">
    
    <!-- Deep Ocean Artistic Waves -->
    <circle cx="0" cy="0" r="100" fill="#134074" fill-opacity="0.5"/>
    <path d="M -80 30 Q -40 -30 0 30 Q 40 90 80 30 L 80 80 L -80 80 Z" fill="#EEF4F8" fill-opacity="0.2"/>
    <path d="M -90 10 Q -45 -50 0 10 Q 45 70 90 10 L 90 80 L -90 80 Z" fill="#8DA9C4" fill-opacity="0.4"/>
    <path d="M -70 -20 Q -35 -70 0 -20 Q 35 30 70 -20 L 70 80 L -70 80 Z" fill="#0B2545"/>
    <!-- Solitary Wooden Boat Silhouette -->
    <path d="M -25 -35 Q 0 -45 25 -35 L 18 -20 L -18 -20 Z" fill="#EEF4F8"/>
    <line x1="0" y1="-38" x2="0" y2="-65" stroke="#EEF4F8" stroke-width="2"/>
    <polygon points="0,-65 20,-50 0,-40" fill="#EEF4F8" fill-opacity="0.8"/>
  
  </g>

  <!-- Book Title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#EEF4F8" letter-spacing="-0.5">
    LAUT
  </text>
  <text x="300" y="585" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#EEF4F8">
    BERCERITA
  </text>

  <!-- Subtitle or Tagline -->
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#A4BFE0" fill-opacity="0.8" letter-spacing="0.5">
    Kisah Haru, Cinta, dan Keberanian Aktivis Mahasiswa
  </text>

  <!-- Author Name -->
  <line x1="220" y1="670" x2="380" y2="670" stroke="#8DA9C4" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="705" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#8DA9C4" letter-spacing="1.5">
    LEILA S. CHUDORI
  </text>

  <!-- Logo Badge at Bottom -->
  <text x="300" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#A4BFE0" fill-opacity="0.5" letter-spacing="2">
    EDISI RESMI • ABOOK STORE
  </text>
</svg>