<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C15C3D"/>
      <stop offset="100%" stop-color="#7B2D19"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Base with Spine & Border -->
  <rect width="600" height="800" rx="16" fill="url(#bgG)"/>

  <!-- Realistic Book Spine 3D Shadow on Left -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="#000000" fill-opacity="0.25"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Outer Frame -->
  <rect x="55" y="45" width="490" height="710" rx="8" fill="none" stroke="#FDF0D5" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="65" y="55" width="470" height="690" rx="4" fill="none" stroke="#FDF0D5" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Category Tag -->
  <rect x="75" y="80" width="140" height="30" rx="6" fill="#FDF0D5" fill-opacity="0.2"/>
  <text x="145" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FDF0D5" letter-spacing="2">
    NON-FIKSI SEJARAH
  </text>

  <!-- Central Graphic Illustration -->
  <g transform="translate(300, 340)">
    
    <!-- Ancient Prehistoric Sun & Handprint Motif -->
    <circle cx="0" cy="0" r="90" fill="#FDF0D5" fill-opacity="0.15"/>
    <circle cx="0" cy="0" r="70" fill="#FDF0D5" fill-opacity="0.25"/>
    <!-- Prehistoric Palm Stencil Handprint Silhouette -->
    <ellipse cx="0" cy="15" rx="30" ry="35" fill="#FFFFFF"/>
    <rect x="-24" y="-35" width="8" height="35" rx="4" fill="#FFFFFF"/>
    <rect x="-10" y="-45" width="8" height="42" rx="4" fill="#FFFFFF"/>
    <rect x="4" y="-42" width="8" height="40" rx="4" fill="#FFFFFF"/>
    <rect x="18" y="-30" width="8" height="30" rx="4" fill="#FFFFFF"/>
    <path d="M -30 5 Q -45 10 -40 -10 Q -25 -5 -25 15" fill="#FFFFFF"/>
  
  </g>

  <!-- Book Title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#FFFFFF" letter-spacing="-0.5">
    SAPIENS
  </text>
  

  <!-- Subtitle or Tagline -->
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#F5D0A9" fill-opacity="0.8" letter-spacing="0.5">
    Riwayat Singkat Umat Manusia dari Zaman Batu ke Era AI
  </text>

  <!-- Author Name -->
  <line x1="220" y1="670" x2="380" y2="670" stroke="#FDF0D5" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="705" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FDF0D5" letter-spacing="1.5">
    YUVAL NOAH HARARI
  </text>

  <!-- Logo Badge at Bottom -->
  <text x="300" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#F5D0A9" fill-opacity="0.5" letter-spacing="2">
    EDISI RESMI • ABOOK STORE
  </text>
</svg>