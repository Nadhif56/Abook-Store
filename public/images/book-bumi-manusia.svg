<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A1D15"/>
      <stop offset="100%" stop-color="#240B07"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Base with Spine & Border -->
  <rect width="600" height="800" rx="16" fill="url(#bgG)"/>

  <!-- Realistic Book Spine 3D Shadow on Left -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="#000000" fill-opacity="0.25"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Outer Frame -->
  <rect x="55" y="45" width="490" height="710" rx="8" fill="none" stroke="#E6C280" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="65" y="55" width="470" height="690" rx="4" fill="none" stroke="#E6C280" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Category Tag -->
  <rect x="75" y="80" width="140" height="30" rx="6" fill="#E6C280" fill-opacity="0.2"/>
  <text x="145" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#E6C280" letter-spacing="2">
    SASTRA NUSANTARA
  </text>

  <!-- Central Graphic Illustration -->
  <g transform="translate(300, 340)">
    
    <!-- Colonial Quill & Wax Seal Motif -->
    <circle cx="0" cy="0" r="105" fill="#E6C280" fill-opacity="0.1"/>
    <ellipse cx="0" cy="0" rx="90" ry="90" fill="none" stroke="#E6C280" stroke-width="2"/>
    <!-- Wax Seal -->
    <circle cx="0" cy="15" r="45" fill="#800E13"/>
    <circle cx="0" cy="15" r="38" fill="#AD2831" stroke="#E6C280" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Merriweather', serif" font-size="28" font-weight="bold" fill="#E6C280">P</text>
    <!-- Elegant Feather Quill -->
    <path d="M -20 80 Q 20 0 65 -75 Q 40 -65 20 -40 Q 5 -10 -20 80" fill="#E6C280"/>
  
  </g>

  <!-- Book Title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#FFF9EF" letter-spacing="-0.5">
    BUMI
  </text>
  <text x="300" y="585" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#FFF9EF">
    MANUSIA
  </text>

  <!-- Subtitle or Tagline -->
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#D4B895" fill-opacity="0.8" letter-spacing="0.5">
    Tetralogi Buru Pertama • Mahakarya Sastra Dunia
  </text>

  <!-- Author Name -->
  <line x1="220" y1="670" x2="380" y2="670" stroke="#E6C280" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="705" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#E6C280" letter-spacing="1.5">
    PRAMOEDYA ANANTA TOER
  </text>

  <!-- Logo Badge at Bottom -->
  <text x="300" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#D4B895" fill-opacity="0.5" letter-spacing="2">
    EDISI RESMI • ABOOK STORE
  </text>
</svg>