<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F3A3D"/>
      <stop offset="100%" stop-color="#0F1E20"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Base with Spine & Border -->
  <rect width="600" height="800" rx="16" fill="url(#bgG)"/>

  <!-- Realistic Book Spine 3D Shadow on Left -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="#000000" fill-opacity="0.25"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Outer Frame -->
  <rect x="55" y="45" width="490" height="710" rx="8" fill="none" stroke="#68B0AB" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="65" y="55" width="470" height="690" rx="4" fill="none" stroke="#68B0AB" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Category Tag -->
  <rect x="75" y="80" width="140" height="30" rx="6" fill="#68B0AB" fill-opacity="0.2"/>
  <text x="145" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#68B0AB" letter-spacing="2">
    BUKU EDUKASI
  </text>

  <!-- Central Graphic Illustration -->
  <g transform="translate(300, 340)">
    
    <!-- Academic Crest / Scholar Compass -->
    <circle cx="0" cy="0" r="100" fill="#68B0AB" fill-opacity="0.1"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#68B0AB" stroke-width="2"/>
    <!-- Mortarboard Cap -->
    <polygon points="0,-40 60,-15 0,10 -60,-15" fill="#68B0AB"/>
    <path d="M -35 0 L -35 25 Q 0 45 35 25 L 35 0" fill="#E5F4F3" fill-opacity="0.2"/>
    <!-- Tassel -->
    <line x1="50" y1="-15" x2="65" y2="15" stroke="#E5F4F3" stroke-width="2"/>
    <circle cx="65" cy="18" r="4" fill="#E5F4F3"/>
  
  </g>

  <!-- Book Title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#E5F4F3" letter-spacing="-0.5">
    METODOLOGI
  </text>
  <text x="300" y="585" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#E5F4F3">
    PENELITIAN
  </text>

  <!-- Subtitle or Tagline -->
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#93C9C5" fill-opacity="0.8" letter-spacing="0.5">
    Panduan Praktis Penulisan Skripsi, Tesis, & Jurnal Ilmiah
  </text>

  <!-- Author Name -->
  <line x1="220" y1="670" x2="380" y2="670" stroke="#68B0AB" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="705" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#68B0AB" letter-spacing="1.5">
    PROF. DR. SOEPOMO
  </text>

  <!-- Logo Badge at Bottom -->
  <text x="300" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#93C9C5" fill-opacity="0.5" letter-spacing="2">
    EDISI RESMI • ABOOK STORE
  </text>
</svg>