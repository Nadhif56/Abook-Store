<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Base with Spine & Border -->
  <rect width="600" height="800" rx="16" fill="url(#bgG)"/>

  <!-- Realistic Book Spine 3D Shadow on Left -->
  <rect x="0" y="0" width="36" height="800" rx="4" fill="#000000" fill-opacity="0.25"/>
  <line x1="36" y1="0" x2="36" y2="800" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>

  <!-- Outer Frame -->
  <rect x="55" y="45" width="490" height="710" rx="8" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="65" y="55" width="470" height="690" rx="4" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25"/>

  <!-- Category Tag -->
  <rect x="75" y="80" width="140" height="30" rx="6" fill="#F59E0B" fill-opacity="0.2"/>
  <text x="145" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="2">
    PENGEMBANGAN DIRI
  </text>

  <!-- Central Graphic Illustration -->
  <g transform="translate(300, 340)">
    
    <!-- Classical Greek/Roman Pillar & Constellation -->
    <circle cx="0" cy="0" r="110" fill="#F59E0B" fill-opacity="0.08"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,6"/>
    <!-- Stylized Stoic Temple Pillar -->
    <path d="M -50 -50 L 50 -50 L 40 -35 L -40 -35 Z" fill="#F59E0B"/>
    <rect x="-35" y="-35" width="14" height="100" fill="#CBD5E1"/>
    <rect x="-7" y="-35" width="14" height="100" fill="#F8FAFC"/>
    <rect x="21" y="-35" width="14" height="100" fill="#CBD5E1"/>
    <rect x="-50" y="65" width="100" height="15" rx="2" fill="#F59E0B"/>
    <!-- Olive Branch -->
    <path d="M -70 20 Q -90 -20 -60 -40 Q -50 -10 -70 20" fill="#F59E0B" fill-opacity="0.8"/>
    <path d="M 70 20 Q 90 -20 60 -40 Q 50 -10 70 20" fill="#F59E0B" fill-opacity="0.8"/>
  
  </g>

  <!-- Book Title -->
  <text x="300" y="540" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#F8FAFC" letter-spacing="-0.5">
    FILOSOFI
  </text>
  <text x="300" y="585" text-anchor="middle" font-family="'Merriweather', serif" font-size="32" font-weight="bold" fill="#F8FAFC">
    TERAS
  </text>

  <!-- Subtitle or Tagline -->
  <text x="300" y="630" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94A3B8" fill-opacity="0.8" letter-spacing="0.5">
    Filsafat Yunani-Romawi Kuno untuk Mental Tangguh
  </text>

  <!-- Author Name -->
  <line x1="220" y1="670" x2="380" y2="670" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.6"/>
  <text x="300" y="705" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#F59E0B" letter-spacing="1.5">
    HENRY MANAMPIRING
  </text>

  <!-- Logo Badge at Bottom -->
  <text x="300" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" fill-opacity="0.5" letter-spacing="2">
    EDISI RESMI • ABOOK STORE
  </text>
</svg>